<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Guidelines — Prototype 2</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: #1a1a1a;
            user-select: none;
        }

        /* ── WALL OUTER ───────────────────────────────── */
        .wall-outer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity   0.55s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .wall-outer.dimmed {
            transform: scale(0.92);
            opacity: 0.12;
            pointer-events: none;
        }

        /* ── WALL TRACK ───────────────────────────────── */
        .wall-track {
            display: grid;
            grid-template-columns: repeat(7, var(--col-w, 0px));
            grid-template-rows: repeat(3, calc((100vh - 20px) / 3));
            grid-auto-flow: column;
            gap: 5px;
            padding: 5px;
            height: 100%;
            cursor: grab;
            will-change: transform;
        }

        .wall-track.grabbing { cursor: grabbing; }

        /* ── CARDS ────────────────────────────────────── */
        .card {
            background: #c6c2bc;
            border-radius: 9px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background 0.15s;
            cursor: pointer;
        }

        .card:hover { transform: scale(1.025); z-index: 2; background: #bbb7b0; }

        .card.side { background: #b8b4ae; }
        .card.side:hover { background: #aeaaa4; }

        .card-num {
            position: absolute;
            top: 14px; left: 16px;
            font-size: 10px; font-weight: 500;
            letter-spacing: 0.12em; text-transform: uppercase;
            color: rgba(0,0,0,0.28);
        }

        .card-thumb {
            position: absolute;
            top: 12px; right: 12px;
            width: 52px; height: 52px;
            background: rgba(255,255,255,0.22);
            border-radius: 6px;
        }

        .card-name {
            position: absolute;
            bottom: 14px; left: 16px;
            font-size: 13px; font-weight: 700;
            letter-spacing: -0.02em; color: #1a1a1a;
        }

        /* ── EXPANDED PANEL ───────────────────────────── */
        .expanded {
            position: fixed;
            z-index: 200;
            background: #c6c2bc;
            overflow: hidden;
            visibility: hidden;
        }

        .expanded.active { visibility: visible; }

        .expanded-inner {
            position: absolute; inset: 0;
            padding: 72px 64px 64px;
            display: flex; flex-direction: column; justify-content: flex-end;
            overflow: hidden;
        }

        .exp-close {
            position: absolute; top: 22px; right: 22px;
            width: 42px; height: 42px;
            border-radius: 50%; border: none;
            background: rgba(0,0,0,0.1);
            font-size: 22px; cursor: pointer; color: #1a1a1a;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s; z-index: 201;
            opacity: 0;
            transition: background 0.15s, opacity 0.3s ease 0.55s;
        }

        .expanded.content-visible .exp-close { opacity: 1; }
        .exp-close:hover { background: rgba(0,0,0,0.18); }

        /* ── CONTENT ELEMENTS ─────────────────────────── */
        .exp-label {
            font-size: 11px; font-weight: 500;
            letter-spacing: 0.12em; text-transform: uppercase;
            color: rgba(0,0,0,0.3); margin-bottom: 20px;
            position: relative; z-index: 1;
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.45s ease 0.35s, transform 0.45s ease 0.35s;
        }

        .expanded.content-visible .exp-label { opacity: 1; transform: none; }

        .exp-heading {
            font-size: clamp(52px, 7.5vw, 100px);
            font-weight: 800; letter-spacing: -0.04em; line-height: 0.92;
            color: #1a1a1a; margin-bottom: 28px;
            position: relative; z-index: 1;
        }

        .headline-line {
            display: block;
            overflow: hidden;
        }

        .headline-inner {
            display: block;
            transform: translateY(110%);
            transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            transition-delay: calc(0.42s + var(--i, 0) * 0.08s);
        }

        .expanded.content-visible .headline-inner { transform: translateY(0); }

        .exp-body {
            font-size: 16px; line-height: 1.65;
            color: rgba(0,0,0,0.48); max-width: 480px; margin-bottom: 44px;
            position: relative; z-index: 1;
            opacity: 0; transform: translateY(18px);
            transition: opacity 0.55s ease 0.62s, transform 0.55s cubic-bezier(0.16,1,0.3,1) 0.62s;
        }

        .expanded.content-visible .exp-body { opacity: 1; transform: none; }

        .exp-demo {
            height: 200px;
            background: rgba(255,255,255,0.2); border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
            color: rgba(0,0,0,0.2);
            position: relative; z-index: 1;
            opacity: 0; transform: translateY(22px) scale(0.98);
            transition: opacity 0.55s ease 0.74s, transform 0.55s cubic-bezier(0.16,1,0.3,1) 0.74s;
        }

        .expanded.content-visible .exp-demo { opacity: 1; transform: none; }

        /* ── PROTO SWITCHER ───────────────────────────── */
        .switcher {
            position: fixed; bottom: 20px; right: 20px;
            z-index: 300; display: flex; gap: 8px;
        }

        .switcher a {
            display: inline-flex; align-items: center;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            color: rgba(255,255,255,0.7); text-decoration: none;
            font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
            padding: 9px 16px; border-radius: 100px;
            transition: background 0.15s, color 0.15s;
        }

        .switcher a:hover  { background: rgba(255,255,255,0.25); color: #fff; }
        .switcher a.active { background: rgba(255,255,255,0.9);  color: #1a1a1a; }
    </style>
</head>
<body>

<div class="wall-outer" id="wallOuter">
    <div class="wall-track" id="wallTrack"></div>
</div>

<div class="expanded" id="expanded">
    <button class="exp-close" id="closeBtn" aria-label="Close">×</button>
    <div class="expanded-inner">
        <span class="exp-label"  id="expLabel"></span>
        <h2  class="exp-heading" id="expHeading"></h2>
        <p   class="exp-body"    id="expBody"></p>
        <div class="exp-demo"    id="expDemo"></div>
    </div>
</div>

<nav class="switcher">
    <a href="index.html">Proto 1</a>
    <a href="prototype-2.html" class="active">Proto 2</a>
    <a href="prototype-3.html">Proto 3</a>
</nav>

<script>
'use strict';

// 7 columns × 3 rows = 21 cards  (grid-auto-flow: column fills top-to-bottom first)
const SECTIONS = [
    // ── 2 left columns ────────────────────────────────
    { num: 'A1', name: 'Brand Overview', label: 'A1 — Brand Overview', heading: 'Who we\nare.',         body: 'An integrated view of the brand: its origin, purpose, and the values that shape everything from product decisions to the tone of a single sentence.', demo: 'Overview', side: true },
    { num: 'A2', name: 'Mission',        label: 'A2 — Mission',        heading: 'What we\ndo.',         body: 'We exist to make complexity feel simple and honest feel bold. That mission runs through every touchpoint — it\'s not a statement, it\'s a standard.',      demo: 'Mission statement', side: true },
    { num: 'A3', name: 'Vision',         label: 'A3 — Vision',         heading: 'Where\nwe\'re going.', body: 'A world where brands speak like people, design earns trust, and every interaction leaves the audience better informed than before it began.',               demo: 'Vision board', side: true },
    { num: 'A4', name: 'Values',         label: 'A4 — Values',         heading: 'What we\nstand for.',  body: 'Clarity over cleverness. Honesty over performance. Restraint over excess. These aren\'t aspirations — they\'re the filter through which every decision passes.', demo: 'Values grid', side: true },
    { num: 'A5', name: 'Audience',       label: 'A5 — Audience',       heading: 'Who we\nserve.',       body: 'Curious, discerning people who value craft and directness in equal measure. They notice when something is done well, and they remember when it isn\'t.',  demo: 'Audience profiles', side: true },
    { num: 'A6', name: 'Personality',    label: 'A6 — Personality',    heading: 'How we\nshow up.',     body: 'Confident without being loud. Warm without being familiar. We have a point of view and we share it — with evidence, not volume.',                        demo: 'Personality spectrum', side: true },

    // ── 3 core columns ────────────────────────────────
    { num: '01', name: 'Tone of Voice',  label: '01 — Tone of Voice',  heading: 'How we\nspeak.',       body: 'Confident, clear, human. We say what we mean without fuss — because the best writing never wastes anyone\'s time. Every word earns its place.',           demo: 'Voice examples' },
    { num: '02', name: 'Typography',     label: '02 — Typography',     heading: 'Letters\nat work.',    body: 'A commanding display face paired with a neutral body typeface. Hierarchy is visible. Scale is expressive. Together they hold any layout together.',        demo: 'Type specimens' },
    { num: '03', name: 'Color Palette',  label: '03 — Color Palette',  heading: 'Colour\nwith intent.', body: 'Earthy, restrained, purposeful. A neutral core with accent tones that pull focus exactly where it\'s needed — never decorative for decoration\'s sake.', demo: 'Colour swatches' },
    { num: '04', name: 'Photography',    label: '04 — Photography',    heading: 'Real\nmoments.',       body: 'Honest light. Unguarded expressions. Environments as they actually look. Our photography doesn\'t perform — it observes. That restraint makes it true.',  demo: 'Photo library' },
    { num: '05', name: 'Iconography',    label: '05 — Iconography',    heading: 'Precise\nmarks.',      body: 'Every icon lives on a 24px grid, drawn at a consistent stroke weight. Legible at any size, designed as a family rather than a loose collection.',         demo: 'Icon grid' },
    { num: '06', name: 'Motion',         label: '06 — Motion',         heading: 'Nothing\nfor show.',   body: 'Motion is intention made visible. We animate to guide attention and confirm actions — never to impress. Gentle easing. Short durations. Purpose in every frame.', demo: 'Motion principles' },
    { num: '07', name: 'Layout',         label: '07 — Layout',         heading: 'Room to\nbreathe.',    body: 'A 12-column grid gives structure without constraint. Generous margins and typographic rhythm make space an active design choice, never an afterthought.',  demo: 'Grid system' },
    { num: '08', name: 'Components',     label: '08 — Components',     heading: 'Built as\na system.',  body: 'Each component works alone and with everything else. States are considered. Accessibility is non-negotiable. The system scales because the parts are honest.', demo: 'Component library' },
    { num: '09', name: 'Brand Story',    label: '09 — Brand Story',    heading: 'Why we\nexist.',       body: 'Every decision traces back to a founding belief: good work, done honestly, is enough. That story isn\'t backstory — it\'s the lens behind every brand expression.', demo: 'Our story' },

    // ── 2 right columns ───────────────────────────────
    { num: 'B1', name: 'Print',          label: 'B1 — Print',          heading: 'On the\npage.',        body: 'Margins, paper stock, print production specs. How the brand holds up when rendered in CMYK and handed to someone across a table.',                        demo: 'Print specs', side: true },
    { num: 'B2', name: 'Digital',        label: 'B2 — Digital',        heading: 'On the\nscreen.',      body: 'Pixel density, responsive behaviour, dark mode considerations. The brand at every resolution and every context a screen can offer.',                       demo: 'Digital specs', side: true },
    { num: 'B3', name: 'Social Media',   label: 'B3 — Social Media',   heading: 'In the\nfeed.',        body: 'Formats, crop zones, caption voice. How to compress the brand into a thumb\'s-width of attention without losing any of its character.',                   demo: 'Social templates', side: true },
    { num: 'B4', name: 'Video',          label: 'B4 — Video',          heading: 'Frame\nby frame.',     body: 'Title cards, lower-thirds, transition logic. Motion applied at scale — every frame a brand decision, every cut considered.',                              demo: 'Video specs', side: true },
    { num: 'B5', name: 'Partnerships',   label: 'B5 — Partnerships',   heading: 'Side by\nside.',       body: 'Co-branding rules, placement, minimum clear space. How the brand shares space without losing its voice or diluting its identity.',                         demo: 'Co-brand examples', side: true },
    { num: 'B6', name: 'Brand in Use',   label: 'B6 — Brand in Use',   heading: 'Real\nworld.',         body: 'The brand across environments: storefronts, packaging, events, merch. Evidence that the system holds up far beyond the screen.',                          demo: 'Real world examples', side: true },
];

const GAP = 5;
const PAD = 5;

const wallOuter = document.getElementById('wallOuter');
const wallTrack = document.getElementById('wallTrack');
const expanded  = document.getElementById('expanded');
const closeBtn  = document.getElementById('closeBtn');

function colWidth() {
    return (window.innerWidth - PAD * 2 - GAP * 2) / 3;
}

function setupGrid() {
    wallTrack.style.setProperty('--col-w', `${colWidth()}px`);
}

// ── Build cards ─────────────────────────────────────────
SECTIONS.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card' + (s.side ? ' side' : '');
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.innerHTML = `
        <div class="card-num">${s.num}</div>
        <div class="card-thumb"></div>
        <div class="card-name">${s.name}</div>
    `;
    card.addEventListener('click', () => {
        if (Math.abs(dragDelta) > 6) return;
        openSection(card, s);
    });
    card.addEventListener('keydown', e => e.key === 'Enter' && openSection(card, s));
    wallTrack.appendChild(card);
});

// ── Pan / drag ──────────────────────────────────────────
let translateX  = 0;
let isDragging  = false;
let dragStartX  = 0;
let dragStartTX = 0;
let dragDelta   = 0;
let velocity    = 0;
let lastX       = 0;
let lastTime    = 0;
let rafId       = null;
let wheelTimer  = null;

function getBounds() {
    const cw = colWidth();
    const trackW = 7 * cw + 6 * GAP + PAD * 2;
    return { min: -(trackW - window.innerWidth), max: 0 };
}

function colStep() { return colWidth() + GAP; }

function setTrack(x, tilt) {
    const { min, max } = getBounds();
    translateX = Math.max(min, Math.min(max, x));
    const t = Math.max(-7, Math.min(7, tilt || 0));
    wallTrack.style.transform = t
        ? `perspective(1200px) translateX(${translateX}px) rotateY(${t}deg)`
        : `translateX(${translateX}px)`;
}

function snapToNearest() {
    cancelAnimationFrame(rafId);
    const step    = colStep();
    const { min, max } = getBounds();
    const snapped = Math.max(min, Math.min(max, -Math.round(-translateX / step) * step));
    wallTrack.style.transition = 'transform 0.55s cubic-bezier(0.16,1,0.3,1)';
    translateX = snapped;
    wallTrack.style.transform = `translateX(${snapped}px)`;
    setTimeout(() => wallTrack.style.transition = '', 560);
}

function startDrag(clientX) {
    isDragging  = true;
    dragStartX  = clientX;
    dragStartTX = translateX;
    dragDelta   = 0;
    velocity    = 0;
    lastX       = clientX;
    lastTime    = performance.now();
    wallTrack.classList.add('grabbing');
    wallTrack.style.transition = '';
    cancelAnimationFrame(rafId);
    clearTimeout(wheelTimer);
}

function moveDrag(clientX) {
    if (!isDragging) return;
    dragDelta = clientX - dragStartX;
    const now = performance.now();
    const dt  = now - lastTime;
    if (dt > 0) velocity = ((clientX - lastX) / dt) * 16;
    lastX    = clientX;
    lastTime = now;
    setTrack(dragStartTX + dragDelta, -velocity * 0.25);
}

function endDrag() {
    if (!isDragging) return;
    isDragging = false;
    wallTrack.classList.remove('grabbing');
    applyMomentum();
}

function applyMomentum() {
    velocity *= 0.88;
    if (Math.abs(velocity) > 1) {
        setTrack(translateX + velocity, -velocity * 0.2);
        rafId = requestAnimationFrame(applyMomentum);
    } else {
        snapToNearest();
    }
}

// Wheel / trackpad — pan freely then snap to column on idle
wallOuter.addEventListener('wheel', e => {
    e.preventDefault();
    wallTrack.style.transition = '';
    cancelAnimationFrame(rafId);
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    setTrack(translateX - delta * 1.2, 0);
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(snapToNearest, 120);
}, { passive: false });

wallTrack.addEventListener('mousedown',  e => { e.preventDefault(); startDrag(e.clientX); });
document.addEventListener('mousemove',   e => moveDrag(e.clientX));
document.addEventListener('mouseup',     () => endDrag());
wallTrack.addEventListener('touchstart', e => startDrag(e.touches[0].clientX), { passive: true });
document.addEventListener('touchmove',   e => moveDrag(e.touches[0].clientX),  { passive: true });
document.addEventListener('touchend',    () => endDrag());

// ── Zoom open / close ───────────────────────────────────
let openRect = null;

function openSection(card, section) {
    openRect = card.getBoundingClientRect();

    document.getElementById('expLabel').textContent = section.label;
    document.getElementById('expHeading').innerHTML = section.heading.split('\n').map((line, i) =>
        `<span class="headline-line"><span class="headline-inner" style="--i:${i}">${line}</span></span>`
    ).join('');
    document.getElementById('expBody').textContent  = section.body;
    document.getElementById('expDemo').textContent  = section.demo;

    setRect(openRect, 9, 'none');
    expanded.classList.add('active');
    wallOuter.classList.add('dimmed');

    requestAnimationFrame(() => requestAnimationFrame(() => {
        setRect({ top: 0, left: 0, width: window.innerWidth, height: window.innerHeight }, 0,
            'top .52s cubic-bezier(.4,0,.2,1),left .52s cubic-bezier(.4,0,.2,1),width .52s cubic-bezier(.4,0,.2,1),height .52s cubic-bezier(.4,0,.2,1),border-radius .52s cubic-bezier(.4,0,.2,1)');
        setTimeout(() => expanded.classList.add('content-visible'), 380);
    }));
}

function closeSection() {
    expanded.classList.remove('content-visible');
    setTimeout(() => {
        if (openRect) {
            setRect(openRect, 9,
                'top .45s cubic-bezier(.4,0,.2,1),left .45s cubic-bezier(.4,0,.2,1),width .45s cubic-bezier(.4,0,.2,1),height .45s cubic-bezier(.4,0,.2,1),border-radius .45s cubic-bezier(.4,0,.2,1)');
        }
        wallOuter.classList.remove('dimmed');
        setTimeout(() => {
            expanded.classList.remove('active');
            expanded.removeAttribute('style');
            openRect = null;
        }, 460);
    }, 100);
}

function setRect({ top, left, width, height }, r, t) {
    expanded.style.cssText = `top:${top}px;left:${left}px;width:${width}px;height:${height}px;border-radius:${r}px;transition:${t};`;
}

closeBtn.addEventListener('click', closeSection);
document.addEventListener('keydown', e => e.key === 'Escape' && closeSection());

// ── Init ────────────────────────────────────────────────
function init() {
    setupGrid();
    const cw = colWidth();
    translateX = -(2 * (cw + GAP));
    wallTrack.style.transform = `translateX(${translateX}px)`;
}

window.addEventListener('resize', () => { setupGrid(); setTrack(translateX, 0); });
init();
</script>
</body>
</html>
